name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEY_PRESENT: "\${{ secrets.KEPTWIDGET_KEYSTORE_B64 != '' && secrets.KEPTWIDGET_KEYSTORE_PASSWORD != '' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK (testing only; not upgrade-stable)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KeptWidget-0.2.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Restore persistent release signing key
        if: \${{ env.RELEASE_KEY_PRESENT == 'true' && github.ref == 'refs/heads/main' }}
        env:
          SIGNING_KEY_BASE64: \${{ secrets.KEPTWIDGET_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keptwidget-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/keptwidget-release.jks" >> "$GITHUB_ENV"
      - name: Build stable signed release APK
        if: \${{ env.RELEASE_KEY_PRESENT == 'true' && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_RELEASE_PASSWORD: \${{ secrets.KEPTWIDGET_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: \${{ env.RELEASE_KEY_PRESENT == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: KeptWidget-0.2.0-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Explain missing signing configuration
        if: \${{ env.RELEASE_KEY_PRESENT != 'true' && github.ref == 'refs/heads/main' }}
        run: echo "::notice::Only a debug APK was built. Configure KEPTWIDGET_KEYSTORE_B64 and KEPTWIDGET_KEYSTORE_PASSWORD repository secrets to enable a permanently signed release APK."
