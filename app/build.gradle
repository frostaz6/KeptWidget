plugins { id 'com.android.application' }

def releaseKeyFile = System.getenv('ANDROID_RELEASE_KEYSTORE')
def releasePassword = System.getenv('ANDROID_RELEASE_PASSWORD')

android {
  namespace 'com.frostaz6.keptwidget'
  compileSdk 35

  defaultConfig {
    applicationId 'com.frostaz6.keptwidget'
    minSdk 26
    targetSdk 35
    versionCode 3
    versionName '0.3.0'
  }

  signingConfigs {
    persistentRelease {
      if (releaseKeyFile != null && !releaseKeyFile.isEmpty() &&
          releasePassword != null && !releasePassword.isEmpty()) {
        storeFile file(releaseKeyFile)
        storePassword releasePassword
        keyAlias 'keptwidget'
        keyPassword releasePassword
        enableV1Signing true
        enableV2Signing true
      }
    }
  }

  buildTypes {
    debug { }
    release {
      minifyEnabled false
      if (releaseKeyFile != null && !releaseKeyFile.isEmpty() &&
          releasePassword != null && !releasePassword.isEmpty()) {
        signingConfig signingConfigs.persistentRelease
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.work:work-runtime:2.10.3'
}
